name: AI Autopilot

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  run-agent:
    runs-on: ubuntu-latest
    if: contains(github.event.issue.labels.*.name, 'feature')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python & deps
        run: |
          python -m pip install --upgrade pip
          pip install watchdog requests pytest mypy

      - name: Pull Ollama image
        run: |
          docker run -d -p 11434:11434 --name ollama ghcr.io/ollama/ollama:latest
          for i in {1..10}; do curl -s http://localhost:11434/health && break || sleep 3; done

      - name: Pull models
        run: |
          docker exec ollama ollama pull mixtral
          docker exec ollama ollama pull nomic-embed-text

      - name: Write feature file from issue body
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          mkdir -p features
          echo "$ISSUE_BODY" > features/issue-${ISSUE_NUMBER}.md

      - name: Run AI Agent
        run: |
          python scripts/ai_agent.py &
          AGENT_PID=$!
          timeout 300 tail --pid $AGENT_PID -f /dev/null
