apiVersion: apps/v1
kind: Deployment
metadata:
  name: qmetier-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: qmetier-api
  template:
    metadata:
      labels:
        app: qmetier-api
    spec:
      containers:
      - name: api
        image: {{ .Values.api.image }}
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          value: "postgresql://postgres:secret@postgres:5432/qmetier"
        - name: REDIS_URL
          value: "redis://redis:6379"
        resources:
          limits:
            cpu: {{ .Values.api.resources.limits.cpu }}
            memory: {{ .Values.api.resources.limits.memory }}
          requests:
            cpu: {{ .Values.api.resources.requests.cpu }}
            memory: {{ .Values.api.resources.requests.memory }}
