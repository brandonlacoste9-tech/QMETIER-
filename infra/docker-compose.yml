version: "3.9"

services:
  postgres:
    image: ankane/pgvector
    environment:
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: qmetier
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  ollama:
    image: ghcr.io/ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  api:
    build: ../backend
    depends_on:
      - postgres
      - redis
      - ollama
    environment:
      - DATABASE_URL=postgresql://postgres:secret@postgres:5432/qmetier
      - OLLAMA_HOST=http://ollama:11434
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"

  ui:
    build: ../frontend
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    ports:
      - "3000:3000"

  matcher:
    build:
      context: ../scripts
      dockerfile: Dockerfile.matcher
    depends_on:
      - postgres
      - ollama
    environment:
      - POSTGRES_URL=postgresql://postgres:secret@postgres:5432/qmetier
      - OLLAMA_EMB=http://ollama:11434/api/embeddings
    ports:
      - "8001:8001"

  telegram-bot:
    build: ../telegram-bot
    depends_on:
      - api
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - API_URL=http://api:8000
    restart: unless-stopped

volumes:
  pgdata:
  ollama:
